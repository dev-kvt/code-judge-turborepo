version: '3.9'

services:
  postgres:
    image: postgres:14-alpine
    ports:
      - 5433:5432
    volumes:
      - db:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=user
      - POSTGRES_DB=codestreax
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d codestreax"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: node:20-bullseye
    ports:
      - 3000:3000
      - 4000:4000
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock # Required for worker to spawn execution sandboxes
    working_dir: /app
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/codestreax?schema=public
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    command: bash -c "npm install && npm run db:pushschema && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  db: