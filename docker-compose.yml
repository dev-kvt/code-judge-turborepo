services:
  app:
    image: node:20-bookworm-slim
    ports:
      - 3000:3000
      - 4000:4000
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock 
    working_dir: /app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    command: bash -c "yarn install --ignore-optional --child-concurrency 1 && yarn cache clean && cd packages/database && npx prisma generate && cd ../worker-judge && npm run dev"